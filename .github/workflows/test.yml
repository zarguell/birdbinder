name: Tests

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24)
        with:
          python-version: "3.14"

      - name: Install deps
        working-directory: backend
        run: |
          pip install -e ".[dev]" || pip install .

      - name: Compile check
        working-directory: backend
        run: |
          python -m py_compile app/*.py app/routers/*.py app/services/*.py
          echo "All files compile OK"

      - name: Run tests
        working-directory: backend
        run: |
          pytest tests/ -v --tb=short
