name: Tests

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0 (Node 24)
        with:
          python-version: "3.14"

      - name: Install deps
        working-directory: backend
        run: |
          pip install -e ".[dev]" || pip install .

      - name: Compile check
        working-directory: backend
        run: |
          python -m py_compile app/*.py app/routers/*.py app/services/*.py
          echo "All files compile OK"

      - name: Run tests
        working-directory: backend
        run: |
          pytest tests/ -v --tb=short
